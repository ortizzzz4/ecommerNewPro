name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ecommerce
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_NAME: ecommerce_test
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Ejecutar tests de Django
        run: python manage.py test --noinput

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar el frontend
        working-directory: frontend
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            cd ~/svr/ecommerNewPro
            git config --global --add safe.directory ~/svr/ecommerNewPro
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build web frontend
            docker compose exec -T web python manage.py migrate --noinput
            docker compose restart web
            cd ~/svr/proxy
            docker compose up -d
            docker compose restart caddy
            docker image prune -f
